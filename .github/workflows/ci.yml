name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` so the package's own `prepare` build cannot run
      # before the checks have had a say. The core devDependency is a git spec
      # pinned to the v0.5.0 tag, so this needs no sibling checkout: a clean
      # runner resolves it over HTTPS exactly as a developer does. Core commits
      # its dist/, so a git install is a real install, not a source tree that
      # would have to be built first.
      - run: npm ci --ignore-scripts

      # This package has no injection-contract script of its own, so the first
      # gate is typecheck: the adapter's config validation and the SessionPorts
      # conformance it imports from the core peer are what typecheck proves.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `dist/` is committed and shipped in `files`, so a consumer installs a
      # build rather than compiling. This is a content check after a real
      # build, never a filename comparison: a stale dist/ surfaces in a
      # consumer as a runtime bug, not as a build error. CI runs on a clean
      # checkout, so index-vs-HEAD is the correct comparison here.
      - name: Committed dist must match a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo '::error::dist/ is stale. Run `npm run build` and commit dist/.'
            git diff --stat -- dist
            exit 1
          fi

      - name: Test
        run: npm run test

      # Consumers import this by subpath, and they always bring their own
      # @ishan/ecosystem-core - it is a required, non-optional peer, because
      # adapter.ts calls core's createSessionService at runtime. So the proof
      # must be a surface WITH that peer present, or it proves the wrong thing.
      # The devDependency already resolved a real core, so it is installed here
      # from the same pinned tag rather than from a local path.
      - name: Prove the package installs and resolves as a real consumer
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          # The required peer, pinned to the same tag, then this package.
          npm install --no-audit --no-fund "github:ishan-parihar/ecosystem-core#v0.5.0"
          npm install --no-audit --no-fund /tmp/ishan-ecosystem-auth-*.tgz
          node --input-type=module -e "
            import * as root from '@ishan/ecosystem-auth';
            import * as adapter from '@ishan/ecosystem-auth/adapter';
            // The runtime value the adapter calls across the peer boundary.
            const core = await import('@ishan/ecosystem-core/auth');
            if (typeof root.createAuthAdapter !== 'function')
              throw new Error('root export missing createAuthAdapter');
            if (typeof adapter.createAuthAdapter !== 'function')
              throw new Error('adapter subpath unresolved');
            if (typeof core.createSessionService !== 'function')
              throw new Error('peer core missing createSessionService');
            console.log('both subpaths resolve with the core peer present');
          "
