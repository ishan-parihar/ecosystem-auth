name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` so the package's own `prepare` build cannot run
      # before the checks have had a say.
      - run: npm ci --ignore-scripts

      # This package has no injection-contract script of its own, so the
      # first gate is the adapter's config validation, which is what this
      # package actually owns: rejecting a bad Better Auth config at
      # construction rather than at request time.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `dist/` is committed and shipped in `files`, so a consumer installs a
      # build rather than compiling. This is a content check after a real
      # build, never a filename comparison: a stale dist/ surfaces in a
      # consumer as a runtime bug, not as a build error.
      - name: Committed dist must match a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo '::error::dist/ is stale. Run `npm run build` and commit dist/.'
            git diff --stat -- dist
            exit 1
          fi

      - name: Test
        run: npm run test

      # Consumers import this by subpath. Prove both subpaths resolve from a
      # real install before a tag, because a broken `prepare` or a wrong
      # `exports` map breaks every consumer's build, not just this repo's.
      - name: Prove the package installs and resolves as a real consumer
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/ishan-ecosystem-auth-*.tgz
          node --input-type=module -e "
            import * as root from '@ishan/ecosystem-auth';
            import * as adapter from '@ishan/ecosystem-auth/adapter';
            if (typeof root.createAuthAdapter !== 'function')
              throw new Error('root export missing createAuthAdapter');
            if (typeof adapter.createAuthAdapter !== 'function' &&
                typeof adapter.createAuthAdapter !== 'undefined')
              throw new Error('adapter subpath unresolved');
            console.log('both subpaths resolve');
          "
